<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Recall</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon1.png">
    <link rel="apple-touch-icon" href="icon1.png">
    <meta name="theme-color" content="#080a0f">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="core/styles.css">
</head>

<body>
    <div id="app">
        <header class="app-header">
            <div style="display:flex; align-items:center; gap:12px;">
                <div class="wordmark">Recall<em>.</em></div>
                <select id="theme-selector" onchange="changeTheme(this.value)"
                    style="background:var(--s2); border:1px solid var(--border); border-radius:8px; padding:5px 10px; color:var(--text); font-size:0.75rem; font-family:'DM Sans',sans-serif; cursor:pointer; appearance:none; -webkit-appearance:none; background-image:url('data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27 viewBox=%270 0 10 6%27%3E%3Cpath d=%27M1 1l4 4 4-4%27 stroke=%27%239ba8be%27 stroke-width=%271.5%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E'); background-repeat:no-repeat; background-position:right 8px center; padding-right:28px;">
                    <option value="default">🌌 Default</option>
                    <option value="cyberpunk" id="opt-theme-cyberpunk" disabled>🔒 Cyberpunk (500 XP)</option>
                </select>
            </div>
            <div class="header-pills">
                <button class="sound-toggle" id="sound-toggle-btn" title="Toggle sound effects">🔊</button>
                <div class="chip">XP <b id="h-xp">0</b></div>
                <div class="chip">Acc <b id="h-acc">—</b></div>
                <div class="chip">🔥 <b id="h-str">0</b></div>
            </div>
        </header>

        <div class="xp-bar-wrap">
            <div class="xp-level-badge">Lv <span id="lv-num">1</span></div>
            <div class="xp-bar-inner">
                <div class="xp-bar-labels">
                    <span id="lv-xp-txt">0 / 100 XP</span>
                    <span id="lv-label">Level 1</span>
                </div>
                <div class="xp-track">
                    <div class="xp-fill" id="lv-bar"></div>
                </div>
            </div>
        </div>

        <nav class="nav-tabs">
            <div class="nav-tab active" data-tab="study">Study</div>
            <div class="nav-tab" data-tab="library">Library</div>
            <div class="nav-tab" data-tab="stats">Stats</div>
        </nav>

        <div id="modules-container"></div>
    </div>
    <div id="toast"></div>

    <script src="core/app.js"></script>
    <script src="core/main.js"></script>
</body>

</html>
